name: gesturebot

services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        VITE_STUDENT_NAME: ${VITE_STUDENT_NAME}
        VITE_STUDENT_NUMBER: ${VITE_STUDENT_NUMBER}
    image: gesturebot-web:local
    ports:
      - "8080:8080"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  handarm:
    build:
      context: .
      dockerfile: docker/handarm.Dockerfile
    image: gesturebot-handarm:local
    environment:
      MUJOCO_GL: osmesa
    volumes:
      - ./recordings:/app/recordings
    restart: "no"
